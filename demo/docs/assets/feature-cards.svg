<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="卡片墙示意图">
  <defs>
    <linearGradient id="fc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0fb"/>
      <stop offset="1" stop-color="#e6eef9"/>
    </linearGradient>
    <linearGradient id="fc-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6bc0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5c6bc0" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="fc-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26a69a" stop-opacity="0.22"/>
