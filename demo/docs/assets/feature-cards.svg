  <rect x="84" y="86" width="34" height="34" rx="10" fill="url(#fc-a)"/>
  <rect x="318" y="86" width="34" height="34" rx="10" fill="url(#fc-b)"/>
  <rect x="552" y="86" width="34" height="34" rx="10" fill="url(#fc-c)"/>
