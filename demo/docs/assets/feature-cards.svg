    </linearGradient>
    <linearGradient id="fc-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef6c00" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ef6c00" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="fc-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a237e" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#fc-bg)"/>

  <g filter="url(#fc-shadow)">
